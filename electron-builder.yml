appId: com.domifly.launcher
productName: DomiFly Launcher
# Esta línea elimina la versión del nombre del instalador ejecutable final
artifactName: "DomiFly Launcher.${ext}"

copyright: 'Copyright © 2026 DomiFly Minecraft by ZamcDev. All rights reserved.'
publish:
  provider: github
  owner: andzamc
  repo: Launcher-DomiFly
  releaseType: release

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win:
  icon: 'build/icon.ico' 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: "DomiFly Launcher"
  uninstallDisplayName: "DomiFly Launcher"

# macOS Configuration
mac:
  icon: 'build/icon.icns'
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'DomiFly Launcher-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  icon: 'build/icon.png'
  maintainer: 'DomiFly Minecraft'
  vendor: 'DomiFly Minecraft'
  synopsis: 'Launcher personalizado de Minecraft para DomiFly'
  description: 'Launcher automatizado para el servidor DomiFly. Descarga, actualiza y gestiona automáticamente los mods, Java y configuraciones necesarias para jugar.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'